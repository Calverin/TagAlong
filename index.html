<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO BLE Radar</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { background-color: #007aff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .radar-display { margin: 40px auto; width: 200px; height: 200px; border-radius: 50%; border: 4px solid #333; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; transition: 0.3s; }
        .status { color: #8e8e93; font-size: 14px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>XIAO Proximity Radar</h1>
    <p>Track distance using raw Bluetooth beacon tracking.</p>
    
    <button id="startBtn">Start Scanning Radar</button>
    
    <div id="radar" class="radar-display">OFF</div>
    <div id="status" class="status">Radar Standby</div>
</div>

<script>
const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const TX_CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
let lastSentCommand = '';

document.getElementById('startBtn').addEventListener('click', async () => {
    try {
        document.getElementById('status').innerText = "Initializing Bluetooth Scan...";
        
        // Use scanning architecture to avoid browser connection blocks
        const scan = await navigator.bluetooth.requestLEScan({
            filters: [{ name: 'XIAO-Radar' }],
            keepRepeatedDevices: true
        });

        document.getElementById('status').innerText = "Radar Scanning Active!";
        document.getElementById('startBtn').style.display = 'none';

        navigator.bluetooth.addEventListener('advertisementreceived', event => {
            if (event.device.name === 'XIAO-Radar') {
                updateRadar(event.rssi, event.device);
            }
        });

    } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = "Scan failed. Ensure Experimental Web Flags are active.";
    }
});

async function updateRadar(rssi, device) {
    const radarElement = document.getElementById('radar');
    let command = 'S';

    if (rssi >= -55) {
        radarElement.innerText = "CRITICAL";
        radarElement.style.borderColor = "#ff3b30";
        radarElement.style.color = "#ff3b30";
        command = 'F';
    } else if (rssi >= -75) {
        radarElement.innerText = "NEAR";
        radarElement.style.borderColor = "#ffcc00";
        radarElement.style.color = "#ffcc00";
        command = 'M';
    } else {
        radarElement.innerText = "FAR";
        radarElement.style.borderColor = "#34c759";
        radarElement.style.color = "#34c759";
        command = 'S';
    }
    
    document.getElementById('status').innerText = `Live Signal: ${rssi} dBm`;

    // Only connect briefly to transmit the change command if the distance state shifts
    if (command !== lastSentCommand) {
        lastSentCommand = command;
        try {
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(UART_SERVICE_UUID);
            const characteristic = await service.getCharacteristic(TX_CHARACTERISTIC_UUID);
            const encoder = new TextEncoder();
            await characteristic.writeValue(encoder.encode(command));
            await server.disconnect(); // Disconnect immediately so the board returns to advertising
        } catch (e) {
            console.log("Transmission window busy, retrying next packet...");
        }
    }
}
</script>
</body>
</html>
